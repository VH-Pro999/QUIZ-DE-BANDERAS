<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QUIZ DE BANDERAS</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background-image:url("https://wallpapers.com/images/hd/high-resolution-3d-aerial-world-map-with-buildings-lf09gl6110je9e91.jpg");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.quiz,#difficulty-selection{
    background:rgba(255,255,255,0.95);
    width:380px;
    max-height:90vh;
    padding:18px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
    text-align:center;
    display:flex;
    flex-direction:column;
}

.flag-box{
    width:100%;
    height:160px;
    margin:10px 0;
    display:flex;
    align-items:center;
    justify-content:center;
}
.flag-box img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

#options{flex-grow:1;}

button{
    width:100%;
    padding:10px;
    margin:6px 0;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
button:hover{transform:scale(1.03);}

.facil{background:#28a745;color:white;}
.normal{background:#ffc107;color:white;}
.dificil{background:#ff0000;color:white;}
.muy-dificil{background:#800080;color:white;}
.hardcore2{background:#000;color:red;}

.score{
    font-size:16px;
    font-weight:bold;
    margin-top:6px;
}
#message{
    margin-top:6px;
    font-weight:bold;
    min-height:22px;
}

/* ===== BOTÓN DE CASA ===== */
#homeButton{
    position:fixed;
    top:10px;
    left:10px;
    z-index:1000;
    font-size:20px;       
    width:auto;            
    padding:6px 10px;      
    border-radius:8px;
    cursor:pointer;
    background:white;      
    border:2px solid #ccc; 
    box-shadow:0 0 8px rgba(0,0,0,0.3);
}
#homeButton:disabled{
    opacity:0.5;
    cursor:not-allowed;
}
#homeButton:hover:enabled{
    box-shadow:0 0 10px gold;
}
</style>
</head>
<body>

<!-- Botón de casa -->
<button id="homeButton" onclick="goToMenu()" disabled>🏠</button>

<div id="difficulty-selection">
    <h2>SELECCIONA TU DIFICULTAD:</h2>
    <button class="facil" onclick="startGame('facil')">😄 FÁCIL (25) 😄</button>
    <button class="normal" onclick="startGame('normal')">😐 NORMAL (50) 😐</button>
    <button class="dificil" onclick="startGame('dificil')">😡 DIFÍCIL (100) 😡</button>
    <button class="muy-dificil" onclick="startGame('hardcore')">👿 MUY DIFÍCIL (211) 👿</button>
    <button class="hardcore2" onclick="startGame('hardcore2')">💀 HARDCORE (???) 💀</button>
</div>

<div class="quiz" id="quiz" style="display:none;">
    <h2>¿DE QUÉ PAÍS ES LA BANDERA?</h2>

    <div class="flag-box">

    </div>

    <div id="options"></div>
    <div class="score" id="score"></div>
    <div id="message"></div>

    <!-- Espaciado inferior original, sin créditos visibles -->

/* ===== POOLS ===== */
const EASY = ["Estados Unidos","China","India","Brasil","Rusia","Japón","Alemania","Reino Unido","Francia","Italia","Canadá","México","Australia","España","Corea del Sur","Argentina","Tailandia","Países Bajos","Arabia Saudita","Sudáfrica","Egipto","Nigeria","Suecia","Suiza","Polonia"];
const NORMAL = [...EASY,"Filipinas","Vietnam","Colombia","Perú","Pakistán","Noruega","Nueva Zelanda","Irán","Grecia","Portugal","Irlanda","Hungría","Israel","Singapur","Bélgica","Dinamarca","Malasia","Chile","Ecuador","Venezuela","Costa Rica","Bangladés","Irak","Marruecos","Argelia"];
const DIFFICULT = [...NORMAL,"Irak","Marruecos","Argelia","Kazajistán","Uzbekistán","Tayikistán","Kirguistán","Sri Lanka","Nepal","Camboya","Laos","Myanmar","Jordania","Kuwait","Omán","Qatar","Emiratos Árabes Unidos","Bahrein","Islandia","Finlandia","Croacia","Serbia","Bosnia y Herzegovina","Montenegro","Macedonia del Norte","Rumania","Bulgaria","Eslovaquia","Eslovenia","Letonia","Lituania","Estonia","Maldivas","Túnez","Panamá","Paraguay","Bolivia","Honduras","Guatemala","El Salvador","Nicaragua","Costa Rica","Cuba","República Dominicana","Jamaica","Haití","Trinidad y Tobago","Andorra","Antigua y Barbuda","Bahamas","Baréin","Barbados","Belice","Benín","Bután","Botsuana","Brunéi","Burkina Faso","Burundi","Cabo Verde"];
const HARDCORE = countries.map(c=>c.n);

/* ===== CONFIG ===== */
const DIFFICULTY_POOLS = {facil:EASY, normal:NORMAL, dificil:DIFFICULT, hardcore:HARDCORE, hardcore2:HARDCORE};
const DIFFICULTY_LIMITS = {facil:25, normal:50, dificil:100, hardcore:countries.length, hardcore2:countries.length};

/* ===== VARIABLES ===== */
let active=[],remaining=[],score=0,answered=0,maxQuestions=0,current=null,lock=false,currentMode="";
const homeButton = document.getElementById("homeButton");

/* ===== UTIL ===== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function disableAllButtons(){document.querySelectorAll("button").forEach(b=>b.disabled=true);}
function enableDifficultyButtons(){document.querySelectorAll("#difficulty-selection button").forEach(b=>b.disabled=false);homeButton.disabled=true;}

/* ===== MENU ===== */
function goToMenu(){
    disableAllButtons();
    document.getElementById("quiz").style.display="none";
    document.getElementById("difficulty-selection").style.display="block";
    enableDifficultyButtons();
}

/* ===== JUEGO ===== */
function startGame(level){
    disableAllButtons();
    document.getElementById("difficulty-selection").style.display="none";
    document.getElementById("quiz").style.display="block";

    homeButton.disabled = false; // se habilita solo durante la partida

    currentMode = level;
    active = countries.filter(c => DIFFICULTY_POOLS[level].includes(c.n));
    maxQuestions = Math.min(DIFFICULTY_LIMITS[level], active.length);
    remaining = shuffle([...active]);
    score = 0;
    answered = 0;

    nextFlag();
}

function nextFlag(){
    lock=false;
    document.getElementById("message").textContent="";
    if(answered >= maxQuestions){
        document.getElementById("message").textContent =`🏁 Adivinaste ${score} de ${maxQuestions} banderas 🏁`;
        disableAllButtons();
        setTimeout(goToMenu,3000);
        return;
    }
    current = remaining.pop();
    document.getElementById("flag").src=`https://flagcdn.com/w320/${current.c.toLowerCase()}.png`;
    const wrong = shuffle(active.filter(c=>c!==current)).slice(0,3);
    const options = shuffle([current.n,...wrong.map(w=>w.n)]);
    const div=document.getElementById("options");
    div.innerHTML="";
    options.forEach(o=>{
        const b=document.createElement("button");
        b.textContent=o;
        b.onclick=()=>check(o);
        div.appendChild(b);
    });
    updateScore();
}

function check(a){
    if(lock) return;
    lock=true;
    document.querySelectorAll("#options button").forEach(b=>b.disabled=true);
    const msg=document.getElementById("message");
    answered++;
    if(a===current.n){
        score++;
        msg.textContent="✅ Correcto";
        msg.style.color="green";
    }else{
        if(currentMode==="hardcore2"){
            msg.textContent=`💀 Incorrecto. Suerte para la próxima 💀`;
            msg.style.color="red";
            disableAllButtons();
            setTimeout(goToMenu,3000);
            return;
        }
        msg.textContent=`❌ Incorrecto. Era ${current.n}`;
        msg.style.color="red";
    }
    updateScore();
    setTimeout(nextFlag,900);
}

function updateScore(){
    document.getElementById("score").textContent=`Puntaje: ${score} / ${maxQuestions}`;
}
